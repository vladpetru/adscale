# Runs the competitor tracker once a day and saves the results back into this repository.
# To change the time, edit the cron line (it is in UTC). 13:17 UTC is 9:17 AM New York time (8:17 AM in winter).
# To check less often, change "checkEveryDays" in competitor-tracker/products.json instead.

name: Competitor tracker

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run now even if the last check was recent'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: competitor-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: competitor-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: competitor-tracker/package-lock.json

      - run: npm ci

      - name: Check competitors
        run: npm run track
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SPAPI_REFRESH_TOKEN: ${{ secrets.SPAPI_REFRESH_TOKEN }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}

      - name: Save results
        run: |
          git config user.name "competitor-tracker"
          git config user.email "competitor-tracker@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Competitor tracker: results for $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
