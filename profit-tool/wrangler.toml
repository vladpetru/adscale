# The name must equal the Cloudflare Pages project name, or the build fails.
name = "outtans-profit"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "outtans-profit"
# Filled in once the D1 database exists (setup checklist, Cloudflare step).
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
